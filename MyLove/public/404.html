<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    (function() {
      var path = window.location.pathname;
      var basePath = '/Page1/';
      var baseIndex = path.indexOf(basePath);
      if (baseIndex === -1) {
        window.location.replace(window.location.origin + basePath);
        return;
      }
      var subPath = path.substring(baseIndex + basePath.length);
      if (!subPath || subPath === 'index.html' || subPath.startsWith('404.html')) {
        window.location.replace(window.location.origin + basePath);
        return;
      }
      sessionStorage.setItem('gh-pages-redirect', subPath);
      window.location.replace(window.location.origin + basePath + 'index.html');
    })();
  </script>
</head>
<body>
  Redirecting...
</body>
</html>
